# dsh-notify — 系统桌面通知（独立插件包）
#
# host 半区监听 Cordis 事件（agent/status、approval/request、agent/error、
# agent/disposed）发系统通知；client 半区提供设置卡片 + 点通知跳会话。
# 配置存 host Config（entry id `dsh-notify`，DSH 0.1.7 起 profile-backed forms）。
#
# Install:   dsh plugin --profile <profile> add <path-or-github>

- insert:
    - id: dsh-notify
      name: '@bittersmilezzz/dsh-notify'